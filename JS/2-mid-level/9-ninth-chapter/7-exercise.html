<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remedial Exam Form</title>
    <link rel="stylesheet" href="7-exercise.css">
</head>
<body>
    
    <form>
        <h2>Remedial Exam Form</h2>
        <input type="text" placeholder="full name" id="name">
        <input type="email" placeholder="email" id="email">
        <input list="subjects" id="subjetc">
        <datalist id="subjects">
            <option value="Spanish">
            <option value="Math">
        </datalist>
        <input type="submit" id="btn-send">
        <div id="message"></div>
    </form>

    <script src="7-exercise.js"></script>

</body>
</html>
