<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback</title>
</head>
<body>
    <script>

        let listNumbers = [1, 2, 3, 4, 5, 6, 7, 8, 9];

        function callbackAdd(number){
            let listOddNumbers = [];
            listOddNumbers.pop(number);

            return listOddNumbers;
        }

        function filterNumbers(listNumbers){
            let = temporalList = [];
            listNumbers.forEach(function(n){
                if(n%2 == 0){
                    temporalList += callbackAdd(n);
                }
            });
            console.log(temporalList)
        }

        filterNumbers(listNumbers);

    </script>
</body>
</html>
