<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback</title>
</head>
<body>
    <script>

function ends(){
    console.log("Finished")
}

function wait(seconds){
    console.log("Staring...")
    setTimeout(ends, seconds);  
}

wait(1000);


    </script>
</body>
</html>
