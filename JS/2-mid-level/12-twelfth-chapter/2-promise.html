<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>
<body>
    <script>

        // define the promise
        const validateTickect = new Promise(function(resolve, reject){
            let isValidTickect = false;

            if(isValidTickect){
                resolve("The tickect is valid");
            }
            else{
                reject("The tickect is not valid");
            }
        })

        // call the promise
        validateTickect 
            .then(function(message){
                console.log("Sucess: " + message);
            })

            .catch(function(message){
                console.log("Error: " + message)
            });
    </script>
</body>
</html>
