<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Of Loop</title>
</head>
<body>
    
    <h1 style="font-weight: 900; text-align:center;">Animals</h1>

    <script>

        let animals = ["fish", "dog", "own", "monkey", "lion"];

        for (let animal of animals){
            document.writeln(animal.toUpperCase() + "<br>")
        }

    </script>

</body>
</html>
