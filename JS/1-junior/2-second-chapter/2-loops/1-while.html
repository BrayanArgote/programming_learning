<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
</head>
<body>
    
    <script>
        let number = 20;

        while(number >= 0){
            document.writeln(number)
            number-=2;
        };

    </script>

</body>
</html>
