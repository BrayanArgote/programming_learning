<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>
<body>
    
    <script>

        for(let f = 1; f <= 10; f++){
            console.log(`${f} x 7 = ${f * 7}\n`);
        };

    </script>

</body>
</html>
