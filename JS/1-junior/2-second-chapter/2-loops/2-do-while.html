<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop</title>
</head>
<body>
    
    <script>
        
        let word;

        do{
            word = prompt("Enter *yes* ");
        }while(word != "yes");


        alert("Fishished")
    </script>
</body>
</html>
