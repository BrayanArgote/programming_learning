<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Attribute</title>
</head>
<body>
    
    <input id="first-input" type="text"> <br><br>
    <input id="second-input" type="text"> <br><br>
    <input id="third-input" type="text">

    <script>

        const input = document.getElementById("first-input");
        input.type = "number";

        const secondInput = document.getElementById("second-input");
        secondInput.maxLength = "3";

        const thirdInput = document.getElementById("third-input");
        thirdInput.placeholder = "1234";

    </script>

</body>
</html>
