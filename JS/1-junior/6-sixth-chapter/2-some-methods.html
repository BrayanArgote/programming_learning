<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get, Set and Remove</title>
</head>
<body>
    
    <label> Enter your name
        <input id="name" type="text">
    </label>

    <script>

        const inputName = document.getElementById("name");

        // get the value of the attribute (getAttribute())
        document.writeln(inputName.getAttribute("type"));


        // set the attribute (setAttribute())
        inputName.setAttribute("type", "number");

        document.writeln(inputName.getAttribute("type"));


        // remove the attribute (removeAttribute)
        inputName.removeAttribute("type");

        document.writeln(inputName.getAttribute("type"));

    </script>

</body>
</html>
