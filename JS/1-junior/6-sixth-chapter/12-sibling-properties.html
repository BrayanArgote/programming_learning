<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling Properties</title>
</head>
<body>
    
    <div>
        <h1 class="one">Title</h1>
        <h2 class="two">Subtitle</h2>
        <p id="three">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        <h3 class="Four">Subtitle</h3>
    </div>

    <script>

        const three = document.getElementById("three");

        console.log(three.nextElementSibling);
        console.log(three.previousElementSibling);

    </script>

</body>
</html>
