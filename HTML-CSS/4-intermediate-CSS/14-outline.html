<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline</title>

    <style>

        :root{
            background-color: #CCC
        }

        div{
            background-color: #48E;
            width:200px;
            height: 200px;
            border-radius: 5px;
            margin:30px;
            transition-property: outline;
        }

        div:hover{
            outline:5PX solid #FEFEFE;
            /* outline-offset: is the space between the element (border) and outline */
        }

        input{
            padding:10px;
            border:none;
            border-bottom:5px solid #48E;
            border-radius:4px;
            margin-left:30px
        }

        input:focus{
            outline:none;
        }

    </style>

</head>
<body>
    <div></div>

    <input>
</body>
</html>
