<!DOCTYPE html>
<html>
    <head>
        <title>Direction</title>
        <link rel="stylesheet" href="1-direction.css">
    </head>

    <body>

        <ul>
            <li>ROW (deafault)</li>
            <div class="flex-box">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>

            <li>ROW-REVERSE</li>
            <div class=" flex-box flex-box-row-reverse">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>

            <li>COLUMN</li>
            <div class="flex-box flex-box-column">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>

            <li>COLUMN-REVERSE</li>
            <div class="flex-box flex-box-column-reverse">
                <div class="flex-item">1</div>
                <div class="flex-item">2</div>
                <div class="flex-item">3</div>
            </div>
        </ul>
    </body>

</html>
