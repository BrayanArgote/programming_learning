<!DOCTYPE html>
<html>
    <head>
        <title>Field and legend</title>
        <link rel="stylesheet" href="5-fieldset-and-legend.css">
    </head>

    <body>

        <form>
            <h2>Form</h2>
                <fieldset>
                    <legend>Basic information</legend>
                    <label>Name</label>
                    <input type="text" placeholder="Jose">
                    <label>Last name</label>
                    <input type="text" placeholder="Juaco">
                    <label>Age</label>
                    <input type="number" placeholder="18">
                </fieldset>

                <fieldset>
                    <legend>Contact information</legend>
                    <label>Phone number</label>
                    <input type="text" placeholder="3203219876">
                    <label>Email</label>
                    <input type="email" placeholder="example@gmail.com">
                </fieldset>

        </form>


    </body>



</html>
