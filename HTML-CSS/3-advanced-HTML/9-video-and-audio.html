<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Video and Audio</title>
        <style>
            div{
                margin:auto;
                width: 90%;
            }
            
            video{
                width:100%;
                background-color:#000
            }
            
            audio{
                margin:30px;
            }
        </style>
    </head>

    <body>
        <div>
            <!-- autoplay muted, controls  -->
            <video autoplay muted controls src="video.mp4"></video>
            
            <audio autoplay muted controls src="audio.mp3"></audio>
        </div>
    </body>
</html>
