<!DOCTYPE html>
<html>
    <head>
        <title>Labels</title>
        <link rel="stylesheet" href="3-labels.css">
        <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6IG_wx1cnny-rxSXXmdpxCquTD-yHjeSJLg&s">
    </head>

    <body>
        <form>
                <h2 class="title">Form Contact</h2>

                <label>Name
                    <div>
                        <input type="text" placeholder="Jose Jacinto">
                    </div>
                </label>

                <label>Email 
                    <div>
                        <input type="email" placeholder="example@gmail.com">
                    </div>
                </label>

                <label for="message">Message</label>
                <div>
                    <textarea rows="4" placeholder="Leave your comment..." id="message"></textarea>
                </div>

                <div class="checkboxe">
                    <label for="checkbox">Accept terms and conditions</label>
                    <input class="checkbox" type="checkbox" id="checkbox">
                </div>
        </form>
    </body>
</html>
